services:
  neo4j-user:
    image: neo4j:5.26
    container_name: ai-paper-neo4j-user
    restart: unless-stopped
    ports:
      - "7476:7474"
      - "7689:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password}
    volumes:
      - neo4j_user_data:/data

  neo4j-rec:
    image: neo4j:5.26
    container_name: ai-paper-neo4j-rec
    restart: unless-stopped
    ports:
      - "7477:7474"
      - "7690:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_REC_AUTH:-neo4j/password}
    volumes:
      - neo4j_rec_data_v2:/data
      - /home/nguyenducthang/neo4j.dump:/import/neo4j.dump:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-paper-backend
    env_file:
      - ./backend/.env
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j-user:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - NEO4J_REC_URI=${NEO4J_REC_URI:-bolt://neo4j-rec:7687}
      - NEO4J_REC_USER=${NEO4J_REC_USER:-neo4j}
      - NEO4J_REC_PASSWORD=${NEO4J_REC_PASSWORD:-password}
      - NEO4J_REC_DATABASE=${NEO4J_REC_DATABASE:-neo4j}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploaded_files:/app/uploaded_files
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - neo4j-user
      - neo4j-rec

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-paper-frontend
    environment:
      - VITE_API_BASE_URL=http://127.0.0.1:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_user_data:
  neo4j_rec_data_v2:
